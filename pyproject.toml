[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "vigie-airport"
version = "0.1.0"
description = "Prototype de corrélation d'événements de sûreté aéroportuaire"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["capture*", "classification*", "correlation*", "ingest*", "simulate*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
